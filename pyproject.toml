[project]
name = "quantcrew"
version = "0.1.0"
description = "QuantCrew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.9.3"
]

[project.scripts]
quantcrew = "quantcrew.main:run"
run_crew = "quantcrew.main:run"
train = "quantcrew.main:train"
replay = "quantcrew.main:replay"
test = "quantcrew.main:test"
run_with_trigger = "quantcrew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
